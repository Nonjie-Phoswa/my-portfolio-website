<header class="navbar-header" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen">
  <div class="navbar-container">
    <a routerLink="/" class="logo-container" (click)="closeMenu()">
      <div class="logo-avatar">
        <img src="./portfolio logo.png" alt="Nonjabulo Phoswa Logo" class="logo-img" />
        <span class="logo-glow"></span>
      </div>
      <div class="logo-brand">
        <span class="brand-name">Nonjabulo</span>
        <span class="brand-title">Software Developer</span>
      </div>
    </a>

    <nav class="nav-menu" [class.active]="isMenuOpen">
      <ul class="nav-links">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()" class="nav-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>About</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Projects</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/certificates" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
            <span>Certificates</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/experience" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            <span>Experience</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/education" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            <span>Education</span>
          </a>
        </li>
      </ul>

      <div class="mobile-cta-wrapper">
        <a href="./Nonjabulo_Phoswa_CV_Software_&_Digital.pdf" download class="resume-btn mobile-resume-btn" (click)="closeMenu()">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Download CV</span>
        </a>
      </div>
    </nav>

    <div class="navbar-actions">
      <a href="./Nonjabulo_Phoswa_CV_Software_&_Digital.pdf" download class="resume-btn desktop-resume-btn">
        <span class="btn-shimmer"></span>
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Download CV</span>
      </a>

      <button class="hamburger" (click)="toggleMenu()" [class.active]="isMenuOpen" aria-label="Toggle Navigation">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
      </button>
    </div>
  </div>
</header>
<div class="menu-overlay" [class.active]="isMenuOpen" (click)="closeMenu()"></div>
