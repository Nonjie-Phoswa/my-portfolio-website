<header class="navbar-header" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen">
  <div class="navbar-container">
    <a routerLink="/" class="logo-container" (click)="closeMenu()">
      <div class="logo-avatar">
        <img src="./portfolio logo.png" alt="Nonjabulo Phoswa Logo" class="logo-img" />
        <span class="logo-glow"></span>
      </div>
      <div class="logo-brand">
        <span class="brand-name">Nonjabulo</span>
        <span class="brand-title">Full-Stack Software Engineer</span>
      </div>
    </a>

    <nav class="nav-menu" [class.active]="isMenuOpen">
      <ul class="nav-links">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()" class="nav-link">
            <span>Home</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
            <span>About</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
            <span>Projects</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/certificates" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
          <span>Certificates</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/experience" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
         <span>Experience</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/education" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
           <span>Education</span>
          </a>
        </li>
      </ul>

      <div class="mobile-cta-wrapper">
        <a href="./Nonjabulo_Phoswa_CV_Software_&_Digital.pdf" download class="resume-btn mobile-resume-btn" (click)="closeMenu()">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Download CV</span>
        </a>
      </div>
    </nav>

    <div class="navbar-actions">
      <a href="./Nonjabulo_Phoswa_CV_Software_&_Digital.pdf" download class="resume-btn desktop-resume-btn">
        <span class="btn-shimmer"></span>
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Download CV</span>
      </a>

      <button class="hamburger" (click)="toggleMenu()" [class.active]="isMenuOpen" aria-label="Toggle Navigation">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
      </button>
    </div>
  </div>
</header>
<div class="menu-overlay" [class.active]="isMenuOpen" (click)="closeMenu()"></div>
